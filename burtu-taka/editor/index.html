<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burtu Taka — Path Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <h1>Path Editor</h1>
    <span class="subtitle">Iekšējs rīks burtu/ciparu ceļu punktu novietošanai</span>
  </header>

  <div class="layout">
    <aside class="panel">

      <section class="block">
        <label class="block-label" for="letterSelect">Burts / cipars</label>
        <select id="letterSelect"></select>
        <label class="checkbox-row">
          <input type="checkbox" id="showReference" checked>
          Rādīt fona burtu (sistēmas fonts)
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="showExisting">
          Rādīt esošos datus (ja ir letters-print.js)
        </label>
      </section>

      <section class="block">
        <div class="block-label">Segmenta tips</div>
        <div class="seg-mode">
          <button type="button" class="mode-btn active" data-mode="line">Taisne (2 punkti)</button>
          <button type="button" class="mode-btn" data-mode="cubic">Līkne (4 punkti)</button>
        </div>
        <p class="hint" id="clickHint">Klikšķini canvas, lai novietotu sākumpunktu.</p>
      </section>

      <section class="block">
        <div class="block-label">Darbības</div>
        <div class="btn-row">
          <button type="button" id="undoPointBtn">↩ Atsaukt punktu</button>
          <button type="button" id="finishStrokeBtn">✓ Pabeigt svītru</button>
        </div>
        <div class="btn-row">
          <button type="button" id="undoStrokeBtn">↩ Dzēst pēdējo svītru</button>
          <button type="button" id="resetBtn" class="danger">⨯ Notīrīt visu</button>
        </div>
      </section>

      <section class="block">
        <div class="block-label">Svītras (<span id="strokeCount">0</span>)</div>
        <ol class="stroke-list" id="strokeList"></ol>
      </section>

      <section class="block">
        <div class="block-label">Eksports</div>
        <textarea id="exportOut" readonly spellcheck="false" placeholder="Kad būs vismaz viena pabeigta svītra, kods parādīsies šeit..."></textarea>
        <div class="btn-row">
          <button type="button" id="copyBtn">📋 Kopēt</button>
        </div>
      </section>

    </aside>

    <main class="canvas-wrap">
      <canvas id="cv" width="640" height="640"></canvas>
      <div class="canvas-footer">
        Autorēšanas režģis: 0–100 (burta kaste x:20–80, cap-height y:15, baseline y:85)
      </div>
    </main>
  </div>
</div>

<script type="module" src="editor.js"></script>
</body>
</html>
